openapi: 3.1.0
info:
  title: OpsBridge AI API
  version: 0.1.0
  description: >
    PRD 8.2 surface. Implemented through P2: health, demo, me, summary, cases and their
    workflow routes, approvals, customers, assignees, and admin status and logout.
    Every other operation is design until a phase implements it. All records are synthetic.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8787
    description: Local wrangler dev
tags:
  - name: demo
    description: Guest sessions
  - name: cases
    description: Case workflow
  - name: documents
    description: Documents and review
  - name: reconciliation
    description: Findings
  - name: automations
    description: Outbox runs
  - name: reporting
    description: Analytics and reports
  - name: integrations
    description: Connector state
  - name: admin
    description: Owner only
  - name: health
    description: Platform checks
security:
  - demoSession: []
  - ownerSession: []
paths:
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness, no dependencies
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness, minimal payload
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/demo/sessions:
    post:
      tags: [demo]
      operationId: createDemoSession
      summary: Create an isolated workspace and session cookie
      security: []
      responses:
        "201":
          description: Session created; sets the __Host-obs_demo cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSession" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      summary: Replace the current workspace with a fresh one
      responses:
        "200":
          description: New workspace in place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSession" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/demo/role:
    post:
      tags: [demo]
      operationId: switchDemoRole
      summary: Switch the simulated role inside the demo workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { enum: [viewer, analyst, manager] }
      responses:
        "200":
          description: Updated capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      tags: [demo]
      operationId: getMe
      summary: Server-authorized capabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/workspace/summary:
    get:
      tags: [demo]
      operationId: getWorkspaceSummary
      summary: Case counts by status for the current workspace and the shared template
      responses:
        "200":
          description: Counts, labeled synthetic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSummary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: Scoped, paginated list
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CaseStatus" } }
        - { name: queue, in: query, schema: { $ref: "#/components/schemas/Queue" } }
        - { name: caseType, in: query, schema: { $ref: "#/components/schemas/CaseType" } }
        - { name: assignee, in: query, description: An assignee ID or the word unassigned, schema: { type: string } }
        - { name: overdue, in: query, schema: { const: "true" } }
        - { name: q, in: query, description: Text in the title or client name, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Page of cases
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Case" }
                  nextCursor: { type: string }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [cases]
      operationId: createCase
      summary: Create a fictional case
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseCreate" }
      responses:
        "201":
          description: Created, or the stored result of the same key with Idempotency-Replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [cases]
      operationId: getCase
      summary: One case with checklist, handoffs, latest approval and documents
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [cases]
      operationId: updateCase
      summary: Update with a version check
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaseUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}/activity:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [cases]
      operationId: caseActivity
      summary: Newest first. Empty for shared template cases, whose audit rows are private
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Page of activity
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
                  nextCursor: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/customers:
    get:
      tags: [cases]
      operationId: listCustomers
      summary: Own-workspace pick list for the create form, at most 100
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
  /api/v1/assignees:
    get:
      tags: [cases]
      operationId: listAssignees
      summary: Own-workspace pick list of fictional consultants, at most 100
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
  /api/v1/cases/{id}/reopen:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [cases]
      operationId: reopenCase
      summary: Closed to Needs Review, reason required
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reopen" }
      responses:
        "200":
          description: Reopened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Case" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}/handoffs:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [cases]
      operationId: createHandoff
      summary: Version-checked assignment transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Handoff" }
      responses:
        "201": { $ref: "#/components/responses/Accepted" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}/checklist/{itemId}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [cases]
      operationId: updateChecklistItem
      summary: Update allowed checklist fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, version]
              properties:
                state: { enum: [open, flagged, done, not_applicable] }
                version: { type: integer }
                evidenceRef: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}/documents:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [documents]
      operationId: initiateUpload
      summary: Owner workspace only. Guests receive 403.
      security:
        - ownerSession: []
      responses:
        "201": { $ref: "#/components/responses/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/cases/{id}/documents/from-fixture:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [documents]
      operationId: attachFixture
      summary: Attach an allowlisted fixture document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fixtureId]
              properties:
                fixtureId: { type: string, pattern: "^fx-[a-z0-9-]{1,40}$" }
      responses:
        "201": { $ref: "#/components/responses/Accepted" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/documents/{id}/review:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [documents]
      operationId: requestReview
      summary: Request a bounded fixture or owner-only live review
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiReview" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/ai-reviews/{id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [documents]
      operationId: decideReview
      summary: Accept, accept with edits, or reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { enum: [accept, accept_with_edits, reject] }
                edits: { type: object, maxProperties: 20 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiReview" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/approvals/{id}/decision:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [cases]
      operationId: decideApproval
      summary: Atomic decision with audit and outbox
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, caseVersion]
              properties:
                decision: { enum: [approve, reject] }
                caseVersion: { type: integer }
                reason: { type: string, maxLength: 500, description: Required on reject }
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/reconciliation:
    get:
      tags: [reconciliation]
      operationId: listFindings
      summary: Mismatches with source evidence
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Page of findings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }
                  nextCursor: { type: string }
  /api/v1/reconciliation/{id}/advance:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [reconciliation]
      operationId: advanceFinding
      summary: Move to Investigating, Proposed, or back to Open from Deferred
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to, version]
              properties:
                to: { enum: [Open, Investigating, Proposed] }
                version: { type: integer }
                proposal: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/reconciliation/{id}/resolve:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [reconciliation]
      operationId: resolveFinding
      summary: Approve, reject or defer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, version]
              properties:
                decision: { enum: [approve, reject, defer] }
                version: { type: integer }
                deferUntil: { type: string, format: date-time }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated finding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/integrations:
    get:
      tags: [integrations]
      operationId: listIntegrations
      summary: Redacted provider state
      responses:
        "200":
          description: Integration list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Integration" }
  /api/v1/automations/runs:
    get:
      tags: [automations]
      operationId: listRuns
      summary: Attempts, status and delivery label
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Page of runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  nextCursor: { type: string }
  /api/v1/inventory:
    get:
      tags: [integrations]
      operationId: listInventory
      summary: Read-only canonical items and snapshots
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
  /api/v1/analytics/overview:
    get:
      tags: [reporting]
      operationId: analyticsOverview
      summary: Deterministic metrics with provenance
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Metric" }
  /api/v1/reports/operations:
    get:
      tags: [reporting]
      operationId: operationsReport
      summary: Validated filters, bounded rows
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/reports/operations/export:
    get:
      tags: [reporting]
      operationId: operationsExport
      summary: Same criteria, capped, formula-safe CSV
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/status:
    get:
      tags: [admin]
      operationId: adminStatus
      summary: Owner identity state. 404 for everyone while identity is unconfigured
      security:
        - ownerSession: []
      responses:
        "200":
          description: Identity state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: Revoke every owner token issued up to now, and audit it
      security:
        - ownerSession: []
      responses:
        "200":
          description: Signed out here. The browser then ends the provider session
          content:
            application/json:
              schema:
                type: object
                required: [signedOut, providerLogoutPath]
                properties:
                  signedOut: { const: true }
                  providerLogoutPath: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/integrations/{id}/sync:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [admin]
      operationId: startSync
      summary: Owner-only read-only sync
      security:
        - ownerSession: []
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/automations/runs/{id}/confirm:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [admin]
      operationId: confirmRun
      summary: Record evidence that moves a run to Confirmed
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidenceRef]
              properties:
                evidenceRef: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/automations/runs/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      tags: [admin]
      operationId: retryRun
      summary: Audited Dead Letter to Pending
      security:
        - ownerSession: []
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: __Host-obs_demo
      description: Opaque, HttpOnly, Secure, SameSite=Strict
    ownerSession:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Proposed. Issuer, audience, expiry, signature and subject allowlist are verified.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 64 }
  responses:
    Accepted:
      description: Done. Detailed bodies are defined by the implementing phase.
      content:
        application/json:
          schema: { type: object }
    Health:
      description: Healthy
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: { const: ok }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: array, items: { type: object } }
    DemoSession:
      type: object
      required: [expiresAt, packVersion]
      properties:
        expiresAt: { type: string, format: date-time }
        packVersion: { type: string }
        demoRole: { enum: [viewer, analyst, manager] }
    Me:
      type: object
      required: [kind, capabilities]
      properties:
        kind: { enum: [guest, owner] }
        demoRole: { enum: [viewer, analyst, manager] }
        capabilities: { type: array, items: { type: string } }
        workspaceMode: { enum: [demo, owner] }
        workspaceName: { type: string }
        expiresAt: { type: string, format: date-time }
        expiresInSeconds: { type: integer, minimum: 0 }
        environment: { type: string }
    WorkspaceSummary:
      type: object
      required: [provenance, workspaceCases, templateCases]
      properties:
        provenance: { const: SYNTHETIC }
        workspaceCases: { type: object, additionalProperties: { type: integer } }
        templateCases: { type: object, additionalProperties: { type: integer } }
    AdminStatus:
      type: object
      required: [ownerIdentity, identityMode, simulated]
      properties:
        ownerIdentity: { type: string, description: Pending Owner Configuration until a real provider is verified }
        identityMode: { enum: [access, local-test-double] }
        simulated: { type: boolean }
    CaseStatus:
      enum: [Draft, Intake, Needs Review, Ready, Approved, Closed]
    Case:
      type: object
      required: [id, status, version, readOnly]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        caseType: { type: string }
        customer: { type: string }
        status: { $ref: "#/components/schemas/CaseStatus" }
        queue: { $ref: "#/components/schemas/Queue" }
        assigneeId: { type: [string, "null"], format: uuid }
        assignee: { type: [string, "null"] }
        dueAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        overdue: { type: boolean }
        ageDays: { type: integer }
        version: { type: integer }
        readOnly: { type: boolean, description: True for shared template rows }
    CaseDetail:
      allOf:
        - { $ref: "#/components/schemas/Case" }
        - type: object
          required: [checklist, handoffs, approval, documents]
          properties:
            checklist: { type: array, items: { type: object } }
            handoffs: { type: array, items: { type: object } }
            approval: { type: [object, "null"] }
            documents: { type: array, items: { type: object } }
    Activity:
      type: object
      required: [id, action, actor, occurredAt]
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string, description: The role that acted. Session and user IDs stay server-side }
        summary: { type: [string, "null"] }
        occurredAt: { type: string, format: date-time }
    Queue:
      enum: [Field Services, Seasonal Staffing]
    CaseType:
      enum: [Onboarding, Billing, Renewal, Field issue]
    CaseCreate:
      type: object
      additionalProperties: false
      required: [title, customerId, caseType]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        customerId: { type: string, format: uuid }
        caseType: { $ref: "#/components/schemas/CaseType" }
        queue: { $ref: "#/components/schemas/Queue" }
        dueAt: { type: string, format: date-time }
        draft: { type: boolean, description: Stay in Draft. Otherwise the case starts in Intake }
    CaseUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer }
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          enum: [Intake, Needs Review, Ready, Closed]
          description: Approved is reachable only through the approval command.
        reason: { type: string, maxLength: 500, description: Required for Ready to Needs Review }
        dueAt: { type: [string, "null"], format: date-time }
    Reopen:
      type: object
      additionalProperties: false
      required: [reason, version]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        version: { type: integer }
    Handoff:
      type: object
      additionalProperties: false
      required: [reason, expectedCaseVersion]
      description: Name exactly one of toAssigneeId and toQueue.
      properties:
        toAssigneeId: { type: string, format: uuid }
        toQueue: { $ref: "#/components/schemas/Queue" }
        reason: { type: string, maxLength: 500 }
        dueAt: { type: string, format: date-time }
        expectedCaseVersion: { type: integer }
    AiReview:
      type: object
      required: [id, status, sourceLabel]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [Queued, Processing, Needs Human Review, Accepted, Accepted with Edits, Rejected, Failed] }
        sourceLabel: { enum: [Deterministic demonstration fixture, Live model output] }
        abstainReason: { enum: [no_extractable_text, ambiguous, adversarial_content, missing_required_fields] }
    Finding:
      type: object
      required: [id, kind, severity, status, version]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        severity: { enum: [low, medium, high] }
        status: { enum: [Open, Investigating, Proposed, Deferred, Resolved, Dismissed] }
        deferUntil: { type: [string, "null"], format: date-time }
        version: { type: integer }
    Integration:
      type: object
      required: [provider, status]
      properties:
        provider: { type: string }
        status: { enum: [Not Configured, Simulated, Connected Test, Degraded, Disconnected] }
        lastSuccessAt: { type: [string, "null"], format: date-time }
    Run:
      type: object
      required: [id, eventType, deliveryLabel, attempts]
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        deliveryLabel: { enum: [Queued, Accepted, Confirmed, Failed, Simulated] }
        attempts: { type: integer }
    Metric:
      type: object
      required: [key, value, provenance]
      properties:
        key: { type: string }
        value: { type: number }
        provenance: { enum: [SYNTHETIC, MEASURED_DEMO, ESTIMATED, UNKNOWN] }
