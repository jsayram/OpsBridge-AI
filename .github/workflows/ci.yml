name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same throwaway local values as infra/docker-compose.yml. Not a credential.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsbridge_admin
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: opsbridge
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U opsbridge_admin -d opsbridge"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:profile
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:fixtures
      - run: npm run check:documents
      - run: npm run eval:ai
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Secret scan, full history
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
